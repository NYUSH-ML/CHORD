# Side environment for sampling from the diffusion / flow baselines
# (SEDD, MDLM, LangFlow, ELF). Their released modeling code targets
# transformers 4.x, so it lives apart from the main `chord-gpu` stack.
# Everything else in this repo (featurization, scoring, analysis, GPT-2 AR
# generation) runs in environment-gpu.yml.
name: chord-generators
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.9
      - transformers==4.44.2
      - einops>=0.8
      - omegaconf>=2.3
      - hydra-core>=1.3
      - datasets>=4.0
      - huggingface_hub>=0.34
      - safetensors>=0.4
