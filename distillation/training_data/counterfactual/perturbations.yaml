# Stage 4b: LLM edits of the 600 training parents by the training editor,
# Mistral-Small-24B-Instruct-2501 (a different editor from the evaluation set's
# Qwen3-30B-A3B, so the student cannot succeed by recognizing the evaluation
# editor). Families, rubrics and doses are those of the evaluation set.
#
#   vllm serve mistralai/Mistral-Small-24B-Instruct-2501 --revision 9527884be6e5616bdd54de542f9ae13384489724 \
#       --served-model-name mistral-24b-editor --port 8000
#   python -m chord.data.generate_perturbations --config distillation/training_data/counterfactual/perturbations.yaml
seed: 20260703
splits: [test]     # prepare_meta_eval_corpus writes all parents as split=test
resume: true       # skip already-written sample_ids (safe to resubmit after a timeout)

input:
  # the 600 parents written by split.yaml (parent_sample_id == parent_id)
  manifest: data/distill/training_data/counterfactual/passages/manifest.jsonl

output:
  perturbations: data/distill/training_data/counterfactual/llm_edits.jsonl

max_candidates: 600

# uniform placement for the dose families (overridable per spec).
llm_position: uniform

# no rule families here — the deterministic order/repetition dose sweep is built
# directly by build_corpus.py (CPU, no LLM).
severity_rates: {mild: 0.10, moderate: 0.25, severe: 0.50}
rule_perturbations: []

llm:
  enabled: true
  base_url: http://127.0.0.1:8000/v1
  # Any OpenAI-compatible endpoint serving the editor model (e.g. `vllm serve`).
  # A different model from the CHORD metric backbones, so the
  # metric is not scoring its own model's generations; and harmful + benign are
  # produced by the SAME editor, so editor identity cancels in S=z(harm)-z(benign).
  model: mistral-24b-editor
  revision: 9527884be6e5616bdd54de542f9ae13384489724   # Mistral-Small-24B-Instruct-2501 snapshot (provenance)
  require_pinned_revision: false
  temperature: 0.0
  timeout_seconds: 240
  # Mistral has no thinking mode -> no chat_template_kwargs. Its vendor chat
  # template injects a default system prompt containing the CURRENT DATE, which
  # makes renders date-dependent and nudges the model to "ask the user to
  # clarify"; an explicit system message replaces that template default
  # entirely. The Qwen editor path sends no system message and is unchanged.
  system_prompt: You are a precise text editor. Follow the transformation rubric exactly and return only the requested JSON.
  max_completion_tokens: 2048
  max_retries: 2
  retry_base_seconds: 1.0
  # rewrite outputs are short (just the k edited sentences) -> raise concurrency.
  max_workers: 32

llm_perturbations:
  # --- harmful semantic / discourse families (dose = n_edits) ---
  - name: internal_contradiction
    dose_levels: [1, 2, 3]
    require_operation_evidence: true
    # ANCHORED construction (the pilot-counterfactual semantics; the in-place midpos
    # variant of this rubric scored S=41): the rewritten target must contradict
    # an explicit claim in a DIFFERENT sentence that stays in the passage, so
    # both incompatible propositions coexist. The ANCHOR:/NEW: evidence format
    # is machine-checked (build drops rows whose anchor is missing/altered; the
    # editor gate aborts if too few rows validate). The earlier meta-eval
    # variant (local fact-flip: the original claim is replaced, so no
    # incompatible pair survives) measured a different axis and was n.s. by
    # construction.
    # {ANCHOR} is substituted by the GENERATOR (llm.py) with a seeded,
    # uniformly-drawn NON-target sentence — the editor does not choose it, and
    # cannot edit it (only target rewrites are spliced back). The recorded
    # anchor makes the build gate deterministic.
    base_rubric: >-
      The ANCHOR is {ANCHOR} — that sentence stays in the passage unchanged.
      Rewrite each numbered target sentence into a fluent statement that
      DIRECTLY CONTRADICTS the claim made by the anchor: assert the opposite
      of what the anchor says while keeping the target's local style and
      length. External real-world truth is irrelevant; only the internal
      inconsistency with the anchor matters. In operation_evidence return
      EXACTLY: ANCHOR: "<the anchor sentence>" || NEW: "<your rewritten
      target sentence>"
  - name: causal_reverse
    dose_levels: [1, 2, 3]
    require_operation_evidence: true
    base_rubric: >-
      Reverse the causal relation expressed at the target sentence while
      preserving the entities and all other facts.
  - name: broken_transition
    dose_levels: [1, 2, 3]
    require_operation_evidence: true
    base_rubric: >-
      Rewrite the target sentence so it no longer follows logically from the
      preceding sentence: introduce an abrupt non-sequitur, or a discourse
      connective (e.g. "Therefore", "As a result", "However", "Consequently")
      attached to a claim that does not follow from the prior context. Keep it a
      single, locally fluent sentence of similar length. It MUST clearly break the
      logical flow and read differently from the original.
  - name: topic_drift
    dose_levels: [1, 2, 3]
    require_operation_evidence: true
    base_rubric: >-
      Replace the target sentence with a fluent but clearly off-topic sentence of
      comparable length, leaving the rest of the passage unchanged.
  # (a key_omission family was dropped by design: not reported in the paper.)

  # --- benign paraphrase control (meaning-preserving surface change) ---
  # Matched to the harmful families: same n_edits uniformly-placed sentence rewrites,
  # but meaning-PRESERVING (dose = n_edits, so benign and harmful change the SAME
  # amount of surface at the SAME kind of positions — isolating coherence).
  - name: para_lexical
    dose_levels: [1, 2, 3]
    base_rubric: >-
      Paraphrase the target sentence: reword it while preserving its exact meaning,
      every claim, entity, number, date, and stance. Do not change the logic.
  - name: para_syntactic
    dose_levels: [1, 2, 3]
    base_rubric: >-
      Rephrase the target sentence by changing its syntax (voice or clause
      structure) without changing its meaning, claims, entities, numbers, or stance.
